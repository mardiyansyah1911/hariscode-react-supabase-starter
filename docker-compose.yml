version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hariscode-postgres
    environment:
      POSTGRES_DB: hariscode
      POSTGRES_USER: hariscode
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hariscode123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - hariscode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hariscode -d hariscode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis (Optional - for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: hariscode-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hariscode-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: hariscode-backend
    ports:
      - "3000:3000"
    environment:
      # Database
      DATABASE_URL: postgresql://hariscode:${DB_PASSWORD:-hariscode123}@postgres:5432/hariscode
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: hariscode
      DB_PASSWORD: ${DB_PASSWORD:-hariscode123}
      DB_NAME: hariscode

      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d

      # Server
      PORT: 3000
      NODE_ENV: development
      API_VERSION: v1

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379

      # Frontend
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173

      # Code Execution
      CODE_EXECUTION_TIMEOUT: 30000
      MAX_MEMORY_USAGE: 128000000
      MAX_CPU_TIME: 5000

      # External Services
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_BASE_URL: https://api.judge0.com

      # Security
      BCRYPT_ROUNDS: 12
      RATE_LIMIT_WINDOW: 15
      RATE_LIMIT_MAX: 100

      # File Upload
      MAX_FILE_SIZE: 10485760
      UPLOAD_PATH: ./uploads

      # Logging
      LOG_LEVEL: info
      LOG_FILE: ./logs/app.log

      # Development
      DEBUG: true
      MOCK_EMAIL: true
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - hariscode-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: npm run dev

  # Frontend (React with Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    container_name: hariscode-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3000
      VITE_APP_NAME: Haris Code
      VITE_APP_VERSION: 1.0.0
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - hariscode-network
    depends_on:
      - backend
    restart: unless-stopped
    command: npm run dev

  # Nginx (Production proxy)
  nginx:
    image: nginx:alpine
    container_name: hariscode-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend_build:/usr/share/nginx/html
    networks:
      - hariscode-network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  frontend_build:
    driver: local

networks:
  hariscode-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16